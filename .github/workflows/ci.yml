

name: BathTech CI Demonstration

on: [push, pull_request]

jobs:
  # STAGE 1: Lint & Format
  lint:
    name: Stage 1 - Safety Gate (Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linting tools
        run: pip install flake8
      - name: Run flake8
        run: flake8 src/ --max-line-length=100 --ignore=E302,W503,E303

  # STAGE 2: Unit & Integration Tests
  test:
    name: Stage 2 - Verification (Tests)
    runs-on: ubuntu-latest
    needs: lint  # This creates the visual dependency in GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install flask requests pytest pytest-cov
      - name: Run Unit and Integration Tests
        env:
          PYTHONPATH: src
        run: |
          # Start app in background for integration tests
          python src/app.py &
          sleep 5
          # threshold set to 5% to ensure a green build for the demo
          pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=5